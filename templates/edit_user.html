{% extends "base.html" %}
{% block title %}Edit User{% endblock %}
{% block content %}
<h2><i class="bi bi-pencil-square me-2"></i>Edit User</h2>
<p><strong>Username:</strong> {{ user[1] }}</p>
<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="password" class="form-label">New Password (leave blank to keep current)</label>
                <input type="password" name="password" id="password" class="form-control">
            </div>
            <div class="mb-3">
                <label for="password_confirm" class="form-label">Confirm New Password</label>
                <input type="password" name="password_confirm" id="password_confirm" class="form-control">
            </div>
            <div class="mb-3">
                <label for="role" class="form-label">Role</label>
                <select name="role" id="role" class="form-select">
                    <option value="viewer" {% if user[2] == 'viewer' %}selected{% endif %}>Viewer</option>
                    <option value="admin" {% if user[2] == 'admin' %}selected{% endif %}>Admin</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="extension" class="form-label">Extension (optional)</label>
                <input type="text" name="extension" id="extension" class="form-control" value="{{ user[3] or '' }}">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" name="email" id="email" class="form-control" value="{{ user[5] if user|length > 5 else '' }}" placeholder="user@example.com">
            </div>
            <div class="mb-3">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" name="email_reports_enabled" id="email_reports_enabled"
                           {% if user|length > 6 and user[6] == 1 %}checked{% endif %}>
                    <label class="form-check-label" for="email_reports_enabled">Enable Email Reports</label>
                </div>
                <div class="form-check form-switch mt-2">
                    <input class="form-check-input" type="checkbox" name="email_alerts_enabled" id="email_alerts_enabled"
                           {% if user|length > 7 and user[7] == 1 %}checked{% endif %}>
                    <label class="form-check-label" for="email_alerts_enabled">Enable Email Alerts</label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Update User</button>
            <a href="{{ url_for('auth.list_users') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
