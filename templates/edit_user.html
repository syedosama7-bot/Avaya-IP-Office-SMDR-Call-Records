<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit User - Avaya CDR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <h2><i class="bi bi-pencil-square me-2"></i>Edit User</h2>
        <p><strong>Username:</strong> {{ user[1] }}</p>
        <form method="POST">
            <div class="mb-3">
                <label for="password" class="form-label">New Password (leave blank to keep current)</label>
                <input type="password" name="password" id="password" class="form-control">
            </div>
            <div class="mb-3">
                <label for="password_confirm" class="form-label">Confirm New Password</label>
                <input type="password" name="password_confirm" id="password_confirm" class="form-control">
            </div>
            <div class="mb-3">
                <label for="role" class="form-label">Role</label>
                <select name="role" id="role" class="form-select">
                    <option value="viewer" {% if user[2] == 'viewer' %}selected{% endif %}>Viewer</option>
                    <option value="admin" {% if user[2] == 'admin' %}selected{% endif %}>Admin</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="extension" class="form-label">Extension (optional)</label>
                <input type="text" name="extension" id="extension" class="form-control" value="{{ user[3] or '' }}">
            </div>
            <button type="submit" class="btn btn-primary">Update User</button>
            <a href="{{ url_for('auth.list_users') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
