<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings - Avaya CDR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <h2 class="mb-4"><i class="bi bi-gear-fill me-2"></i>System Settings</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <div class="card mb-4">
            <div class="card-header">SMDR Listener</div>
            <div class="card-body">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="smdr_ip" class="form-label">IP Address</label>
                            <input type="text" name="smdr_ip" id="smdr_ip" class="form-control" value="{{ settings['smdr_ip'] }}">
                        </div>
                        <div class="col-md-6">
                            <label for="smdr_port" class="form-label">Port</label>
                            <input type="number" name="smdr_port" id="smdr_port" class="form-control" value="{{ settings['smdr_port'] }}" min="1" max="65535">
                        </div>
                    </div>
                    <hr>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="web_host" class="form-label">Web Interface Host</label>
                            <input type="text" name="web_host" id="web_host" class="form-control" value="{{ settings['web_host'] }}">
                        </div>
                        <div class="col-md-6">
                            <label for="web_port" class="form-label">Web Interface Port</label>
                            <input type="number" name="web_port" id="web_port" class="form-control" value="{{ settings['web_port'] }}" min="1" max="65535">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-3">Save Settings</button>
                    <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
                </form>
                <div class="alert alert-info mt-3">
                    <i class="bi bi-info-circle"></i> After saving, you must restart the application for the new settings to take effect.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
