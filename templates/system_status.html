<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System Status - Avaya CDR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <meta http-equiv="refresh" content="15">
</head>
<body class="bg-light">
    <div class="container py-4">
        <h2 class="mb-4"><i class="bi bi-hdd-stack"></i> System Status</h2>
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Server Name</th>
                    <th>IP Address</th>
                    <th>Status</th>
                    <th>Last Seen</th>
                </tr>
            </thead>
            <tbody>
                {% for server in servers %}
                <tr>
                    <td>{{ server.name }}</td>
                    <td>{{ server.ip }}</td>
                    <td>
                        {% if server.connected %}
                            <span class="badge bg-success">Online</span>
                        {% else %}
                            <span class="badge bg-secondary">Offline</span>
                        {% endif %}
                    </td>
                    <td>{{ server.last_seen or 'Never' }}</td>
                </tr>
                {% else %}
                <tr><td colspan="4" class="text-center">No PABX servers configured.</td></tr>
                {% endfor %}
            </tbody>
        </table>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary">Back to Dashboard</a>
    </div>
</body>
</html>
