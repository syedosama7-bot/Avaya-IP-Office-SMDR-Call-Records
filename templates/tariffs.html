{% extends "base.html" %}
{% block title %}Tariffs{% endblock %}
{% block content %}
<div class="card mb-4">
    <div class="card-header">Manage Tariffs (PKR)</div>
    <div class="card-body">
        <form method="POST" class="row g-3 mb-4">
            <div class="col-md-3"><input type="text" name="prefix" class="form-control" placeholder="Prefix (e.g. 03)"></div>
            <div class="col-md-4"><input type="text" name="description" class="form-control" placeholder="Network Name"></div>
            <div class="col-md-2"><input type="number" step="0.01" name="rate" class="form-control" placeholder="Rate/Min"></div>
            <div class="col-md-3"><button type="submit" class="btn btn-primary w-100">Save Rate</button></div>
        </form>
        <div class="table-responsive">
            <table class="table table-striped">
                <thead><tr><th>Prefix</th><th>Destination</th><th>Rate/Min</th></tr></thead>
                <tbody>
                    {% for t in tariffs %}
                    <tr><td>{{ t[1] }}</td><td>{{ t[2] }}</td><td>{{ t[3] }} PKR</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
